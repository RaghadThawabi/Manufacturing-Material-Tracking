    "/auth/user": {
      "get": {
        "tags": [
          "Auth"
        ],
        "operationId": "getCurrentAuthUser",
        "summary": "Get the currently authenticated user",
        "parameters": [
          {
            "$ref": "#/components/parameters/AuthorizationSessionHeader"
          },
          {
            "$ref": "#/components/parameters/SessionCookie"
          }
        ],
        "responses": {
          "200": {
            "description": "Auth status resolved successfully.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthUserEnvelope"
                }
              }
            }
          }
        }
      }
    },
    "/login": {
      "get": {
        "tags": [
          "Auth"
        ],
        "operationId": "beginBrowserLogin",
        "summary": "Start the browser OIDC login flow",
        "parameters": [
          {
            "name": "returnTo",
            "in": "query",
            "required": false,
            "description": "Relative path to redirect to after login (must start with `/`). Defaults to `/`.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to the OIDC authorization endpoint."
          }
        }
      }
    },
    "/callback": {
      "get": {
        "tags": [
          "Auth"
        ],
        "operationId": "handleBrowserLoginCallback",
        "summary": "Complete the browser OIDC login flow",
        "parameters": [
          {
            "name": "code",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "state",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "iss",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "uri"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure."
          }
        }
      }
    },
    "/logout": {
      "get": {
        "tags": [
          "Auth"
        ],
        "operationId": "logoutBrowserSession",
        "summary": "Clear the session and begin OIDC logout",
        "parameters": [
          {
            "$ref": "#/components/parameters/AuthorizationSessionHeader"
          },
          {
            "$ref": "#/components/parameters/SessionCookie"
          },
          {
            "name": "returnTo",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "default": "/"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path."
          }
        }
      }
    },
    "/mobile-auth/token-exchange": {
      "post": {
        "tags": [
          "Auth"
        ],
        "operationId": "exchangeMobileAuthorizationCode",
        "summary": "Exchange a mobile OIDC code for a session token",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MobileTokenExchangeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Session created successfully.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileTokenExchangeSuccess"
                }
              }
            }
          },
          "400": {
            "description": "Missing or invalid required fields.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "401": {
            "description": "Token did not contain usable claims.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "500": {
            "description": "Token exchange failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        }
      }
    },
    "/mobile-auth/logout": {
      "post": {
        "tags": [
          "Auth"
        ],
        "operationId": "logoutMobileSession",
        "summary": "Delete a mobile session token",
        "parameters": [
          {
            "$ref": "#/components/parameters/AuthorizationSessionHeader"
          }
        ],
        "responses": {
          "200": {
            "description": "Logout processed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LogoutSuccess"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "AuthorizationSessionHeader": {
        "name": "Authorization",
        "in": "header",
        "required": false,
        "description": "Opaque session token — `Bearer <sid>`.",
        "schema": {
          "type": "string"
        }
      },
      "SessionCookie": {
        "name": "sid",
        "in": "cookie",
        "required": false,
        "description": "Browser session cookie.",
        "schema": {
          "type": "string"
        }
      }
    },
    "schemas": {
      "HealthStatus": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ]
      },
      "Setting": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "enum": [
              "material",
              "machine",
              "product",
              "reason",
              "unit"
            ]
          },
          "name": {
            "type": "string"
          },
          "active": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "kind",
          "name",
          "active"
        ]
      },
      "SettingInput": {
        "type": "object",
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "material",
              "machine",
              "product",
              "reason",
              "unit"
            ]
          },
          "name": {
            "type": "string",
            "minLength": 1
          },
          "active": {
            "type": "boolean"
          }
        },
        "required": [
          "kind",
          "name"
        ]
      },
      "Company": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "role": {
            "type": "string"
          },
          "tolerance": {
            "type": "number"
          },
          "settings": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Setting"
            }
          }
        },
        "required": [
          "id",
          "name",
          "role",
          "tolerance",
          "settings"
        ]
      },
      "CompanyInput": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1
          },
          "unit": {
            "type": "string",
            "enum": [
              "kg",
              "sheets",
              "m"
            ]
          },
          "loadSamples": {
            "type": "boolean"
          }
        },
        "required": [
          "name",
          "unit"
        ]
      },
      "CompanyUpdate": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1
          },
          "tolerance": {
            "type": "number",
            "minimum": 0
          }
        },
        "required": [
          "name",
          "tolerance"
        ]
      },
      "Member": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "userId": {
            "type": [
              "string",
              "null"
            ]
          },
          "name": {
            "type": "string"
          },
          "role": {
            "type": "string"
          },
          "inviteCode": {
            "type": [
              "string",
              "null"
            ]
          },
          "active": {
            "type": "boolean"
          },
          "version": {
            "type": "integer"
          },
          "inviteExpiresAt": {
            "type": [
              "string",
              "null"
            ]
          },
          "history": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Audit"
            }
          }
        },
        "required": [
          "id",
          "userId",
          "name",
          "role",
          "inviteCode"
        ]
      },
      "MemberInput": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1
          },
          "role": {
            "type": "string",
            "enum": [
              "operator",
              "supervisor",
              "manager",
              "admin"
            ]
          }
        },
        "required": [
          "name",
          "role"
        ]
      },
      "JoinInput": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "code"
        ]
      },
      "Scrap": {
        "type": "object",
        "properties": {
          "reason": {
            "type": "string"
          },
          "quantity": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          }
        },
        "required": [
          "reason",
          "quantity"
